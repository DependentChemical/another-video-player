[package]
name = "app-core"
description = "Flatline: the composition root and application shell for the video player."
version = "0.4.83"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The exe version info is the label Windows shows for the player (file
# properties, task manager); winres fills it with the package name by
# default, so we say what the player is called instead.
[package.metadata.winres]
ProductName = "Flatline"
FileDescription = "Flatline"

# Layer 3: the composition root. The only crate that wires capabilities together.
[dependencies]
app-logging = { workspace = true }
library = { workspace = true }
media-model = { workspace = true }
playback-engine = { workspace = true }
storyboard = { workspace = true }
stream-resolver = { workspace = true }
settings = { workspace = true }
ui-kit = { workspace = true }
video-surface = { workspace = true }
web-session = { workspace = true }
source-youtube = { workspace = true }
source-twitch = { workspace = true }
ytdlp-tool = { workspace = true }
updater = { workspace = true }
slint = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

[[bin]]
name = "flatline"
path = "src/main.rs"

[lib]
name = "app_core"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
