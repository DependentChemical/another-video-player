[package]
name = "media-model"
description = "Shared data types for Flatline: media sources, stream catalogs, qualities and playback plans."
version = "0.4.81"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Layer 0: this crate is the vocabulary. It must not depend on any other
# Flatline crate. The `url` dependency is only used to parse URLs for host
# matching in `Service::from_url`, which keeps the layer 0 rule intact.
[dependencies]
md5 = { workspace = true }
serde = { workspace = true }
url = { workspace = true }
