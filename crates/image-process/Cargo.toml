[package]
name = "image-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Converts downloaded thumbnails to JPEG so the UI can render them."

[dependencies]
# --- internal crates ---------------------------------------------------------
media-model = { path = "../media-model" }

# --- external crates ---------------------------------------------------------
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"