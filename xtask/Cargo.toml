[package]
name = "xtask"
description = "Build orchestration for Flatline: dependency provisioning, workspace build and packaging."
version = "0.4.80"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
ureq = { workspace = true }
ytdlp-tool = { workspace = true }
zip = { workspace = true }

# Only the Windows dependency provisioning uses these; on the other
# platforms they would be flagged as unused dependencies.
[target.'cfg(windows)'.dependencies]
serde = { workspace = true }
sevenz-rust2 = "0.25"
