name: Release

# A release is produced when the Build workflow succeeds on `main`. The
# version of the project is `[workspace.package].version` in `Cargo.toml`; a
# release is only published when that version does not have a tag yet. Small
# changes keep the version and therefore never produce a release.
on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish-release:
    name: Publish the release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download the Windows archive
        uses: actions/download-artifact@v5
        with:
          name: flatline-windows-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: release-artifact/windows

      - name: Download the Linux archive
        uses: actions/download-artifact@v5
        with:
          name: flatline-linux-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: release-artifact/linux

      - name: Create the release
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;

            // The workspace version in Cargo.toml is the single source of
            // truth for the version of the project.
            const manifestFile = (await github.rest.repos.getContent({
              owner,
              repo,
              path: 'Cargo.toml',
              ref: headSha,
            })).data;
            if (!manifestFile.content || !manifestFile.encoding) {
              throw new Error('Unable to read Cargo.toml from the release commit.');
            }
            const manifest = Buffer.from(manifestFile.content, manifestFile.encoding)
              .toString('utf8');
            const workspacePackage = manifest.match(
              /^\s*\[workspace\.package\]([\s\S]*?)(?=^\s*\[|$)/m,
            );
            const versionMatch = workspacePackage
              && workspacePackage[1].match(/^\s*version\s*=\s*"([^"]+)"/m);
            if (!versionMatch) {
              throw new Error('Unable to read [workspace.package].version from Cargo.toml.');
            }
            const version = versionMatch[1].trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`"${version}" is not a version number.`);
            }

            const tag = `v${version}`;

            // Versions are tags. A tag that already exists was released
            // before, so a small change that does not move the version ends
            // here instead of producing a second release.
            let tagExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              tagExists = false;
            }
            if (tagExists) {
              core.info(`The tag ${tag} already exists, there is nothing to release.`);
              return;
            }

            // The message of the release is the message of the commit that
            // the build succeeded on.
            const commit = (await github.rest.repos.getCommit({
              owner,
              repo,
              ref: headSha,
            })).data;
            const body = commit.commit.message.trim() || `Flatline ${version}`;

            const release = (await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: headSha,
              name: `Flatline ${version}`,
              body,
              draft: false,
              prerelease: false,
            })).data;

            const folders = ['release-artifact/windows', 'release-artifact/linux'];
            for (const folder of folders) {
              const directory = path.join(process.env.GITHUB_WORKSPACE, folder);
              if (!fs.existsSync(directory)) {
                throw new Error(`The ${folder} archive is missing, the release needs both.`);
              }
              let uploaded = 0;
              for (const file of fs.readdirSync(directory)) {
                if (!file.endsWith('.zip')) {
                  continue;
                }
                const assetPath = path.join(directory, file);
                const assetData = fs.readFileSync(assetPath);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.id,
                  name: file,
                  headers: {
                    'content-length': assetData.length,
                    'content-type': 'application/zip',
                  },
                  data: assetData,
                });
                uploaded += 1;
                core.info(`Uploaded ${file}`);
              }
              if (uploaded === 0) {
                throw new Error(`The ${folder} archive is missing, the release needs both.`);
              }
            }

            // `latest` always points at the newest release commit, so it is
            // one ref to fetch no matter which version is current.
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/latest' });
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'tags/latest',
                sha: headSha,
                force: true,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/tags/latest',
                sha: headSha,
              });
            }
            core.info(`The latest tag now points at ${headSha}`);
