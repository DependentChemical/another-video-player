name: dev-test

# The pre-test for `main`: it runs everything a release needs (the tests and
# both platform builds) but it never creates a release. It is run manually on
# `dev` before the changes are merged into `main`, where the automated Build
# and Release workflows take over. It does not run on every push so that many
# commits can land between checks.
on:
  workflow_dispatch:

concurrency:
  group: dev-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install the dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libmpv-dev \
            libfontconfig1-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check the isolation of the crates
        run: cargo xtask isolation

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: xvfb-run -a cargo test --workspace

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and package
        run: cargo xtask build

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: flatline-dev-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x86-64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install the dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libmpv-dev \
            libfontconfig1-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and package
        run: cargo xtask build

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: flatline-dev-linux-x86_64
          path: dist/*.zip
          if-no-files-found: error
